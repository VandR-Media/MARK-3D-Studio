name: MARK Studio Pass 20 multiple cap Pokes and stable remap

on:
  push:
    branches:
      - feature/pro-studio-pass20-multi-poke-remap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-poke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate syntax
        run: |
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/meshdata-halfedge-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check tests/pro-studio-pass20-multi-poke-remap.test.mjs
          node --check scripts/pro-studio-pass20-multi-poke-webgl-accept.mjs
      - name: Test multiple real Pokes, rig attributes and source-stable ID map
        run: node --test tests/pro-studio-pass20-multi-poke-remap.test.mjs
      - name: Previous Pass9-19 mesh and Visual Engine v2 regressions
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs tests/pro-studio-pass16-explicit-seam-links.test.mjs tests/pro-studio-pass17-seam-region-extrude.test.mjs tests/pro-studio-pass18-halfedge-cap-move.test.mjs tests/pro-studio-pass19-cap-poke-remap.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build actual offline WebGL2 editor
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Pass19 regression of real first Poke and ray-picked new triangle
        run: node scripts/pro-studio-pass19-poke-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Pass20 real second Poke, face 12 raycast, GLB-native and undo/redo
        run: node scripts/pro-studio-pass20-multi-poke-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload reproducible real WebGL screenshots and lossless source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass20-multi-poke-webgl
          path: |
            dist/pro-studio/pass19-acceptance/**
            dist/pro-studio/pass20-acceptance/**
          if-no-files-found: warn
          retention-days: 14
