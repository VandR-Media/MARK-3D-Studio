name: MARK Studio Pass30 read-only edge split planning
on:
  push:
    branches:
      - feature/pro-studio-pass30-edge-split-plan
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-split-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/pro-studio/owned-edge-split-plan.js
      - run: node --test tests/pro-studio-pass30-edge-split-plan.test.mjs
      - run: node --test tests/pro-studio-pass29-owned-topology.test.mjs
