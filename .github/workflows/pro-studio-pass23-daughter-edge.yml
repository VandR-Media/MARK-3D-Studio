name: MARK Studio Pass 23 verified daughter-edge lineage

on:
  push:
    branches:
      - feature/pro-studio-pass23-child-edge-lineage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daughter-edge-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source and browser test syntax
        run: |
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/meshdata-halfedge-preview.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check tests/pro-studio-pass23-child-edge-lineage.test.mjs
          node --check scripts/pro-studio-pass23-child-edge-webgl-accept.mjs
      - name: Test actual daughter split, source-bound IDs, UV, skin, morph and native project
        run: node --test tests/pro-studio-pass23-child-edge-lineage.test.mjs
      - name: Regression Pass9–22 and Visual Engine v2
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs tests/pro-studio-pass16-explicit-seam-links.test.mjs tests/pro-studio-pass17-seam-region-extrude.test.mjs tests/pro-studio-pass18-halfedge-cap-move.test.mjs tests/pro-studio-pass19-cap-poke-remap.test.mjs tests/pro-studio-pass20-multi-poke-remap.test.mjs tests/pro-studio-pass21-radial-edge-split.test.mjs tests/pro-studio-pass22-multi-radial-splits.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build real offline WebGL2 editor
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Previous Pass22 real two-radial-split browser regression
        run: node scripts/pro-studio-pass22-multi-radial-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Pass23 daughter edge mouse selection, new child face, true native replay
        run: node scripts/pro-studio-pass23-child-edge-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload exact-SHA real PNG GLB native .markscene and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass23-daughter-edge-webgl
          path: |
            dist/pro-studio/pass22-acceptance/**
            dist/pro-studio/pass23-acceptance/**
          if-no-files-found: warn
          retention-days: 14
