name: MARK Blender Cloud — Neon Boy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mark-blender-cloud.yml'
      - 'tools/neon_boy_builder.py'

permissions:
  contents: read

jobs:
  blender-neon-boy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
      - name: Create Neon Boy — animated GLB, static GLB, Blender source, previews
        run: |
          blender --background --threads 2 --python tools/neon_boy_builder.py 2>&1 | tee blender_run.log
          grep -q 'MARK_EXPORT_SUCCESS' blender_run.log
          test -s output/NEON_BOY_DANCE.glb
          test -s output/NEON_BOY_STATIC.glb
          test -s output/NEON_BOY_MASTER.blend
          test -s output/preview_front.png
          test -s output/validation.json
      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Neon-Boy-Review
          path: |
            output/
            blender_run.log
          if-no-files-found: warn
          retention-days: 30
