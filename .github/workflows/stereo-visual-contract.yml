name: MARK Stereo Visual — six hybrid preset contracts
on:
  push:
    branches:
      - feature/stereo-visual-preset-contract
  pull_request:
    paths:
      - presets/mark-stereo-visual-collection-v1.json
      - schemas/mark-stereo-visual-collection-v1.schema.json
      - tests/stereo-visual-presets.test.mjs
      - .github/workflows/stereo-visual-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate all six stereo 2D/3D presets
        run: node --test tests/stereo-visual-presets.test.mjs
