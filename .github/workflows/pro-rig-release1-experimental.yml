name: MARK Professional Studio R1 experimental rig playback QA
on:
  push:
    branches:
      - develop/pro-studio-release0-audit
    paths:
      - 'src/pro-studio/**'
      - 'scripts/pro-studio-*.mjs'
      - 'tests/pro-studio-*.mjs'
      - 'package.json'
      - '.github/workflows/pro-rig-release1-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mark-pro-rig-r1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rig-playback:
    name: Actual WebGL2 rigs and animated GLB round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked JS library versions
        run: npm install --no-audit --no-fund
      - name: Validate source syntax
        run: |
          node --check src/pro-studio/rig-viewer.js
          node --check scripts/pro-studio-rig-build.mjs
          node --check scripts/pro-studio-rig-accept.mjs
          node --check tests/pro-studio-release1.test.mjs
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/glb-semantic-diff.js
          node --check tests/pro-studio-release1-v3.test.mjs
          node --check scripts/pro-studio-v3-preview.mjs
      - name: Old v2 compatibility and rigged transport regression
        run: |
          npm run test:pro-rig
          node --test tests/pro-studio-release1-v3.test.mjs
          npm run test:visual-v2
      - name: Build genuine fixture, secure archive and offline Three.js viewer
        run: |
          npm run pro:rig:fixtures
          npm run pro:rig:qa
          npm run pro:rig:viewer
          npm run pro:rig:native
      - name: Install Chromium and required MP4 encoder
        timeout-minutes: 12
        run: |
          npx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Capture real skinned poses, morphs, 3 clips, viewpoints, animated GLB export and frames
        run: npm run pro:rig:accept
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload source-matched audit evidence regardless of test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pro-rig-r1-real-webgl
          path: |
            dist/pro-studio/fixtures/*.glb
            dist/pro-studio/release1-preview/**
            dist/pro-studio/native-scene/**
            dist/pro-studio/rig-viewer-offline.html
            dist/pro-studio/acceptance/**
          if-no-files-found: warn
          retention-days: 14
