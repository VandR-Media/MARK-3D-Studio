name: MARK Studio Pass 18 source-stable halfedge MeshData and cap moves

on:
  push:
    branches:
      - feature/pro-studio-pass18-halfedge-cap-move
  workflow_dispatch:

permissions:
  contents: read

jobs:
  halfedge-cap-move:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify syntax
        run: |
          node --check src/pro-studio/meshdata-halfedge-preview.js
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check tests/pro-studio-pass18-halfedge-cap-move.test.mjs
          node --check scripts/pro-studio-pass18-cap-webgl-accept.mjs
      - name: Test source-bound halfedges, cap UV and native-safe cap move
        run: node --test tests/pro-studio-pass18-halfedge-cap-move.test.mjs
      - name: Regression Pass9–17 and Visual Engine v2
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs tests/pro-studio-pass16-explicit-seam-links.test.mjs tests/pro-studio-pass17-seam-region-extrude.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build real offline WebGL2 editor
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Regression real physical skinned seam extrusion
        run: node scripts/pro-studio-pass17-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Real sequential stable cap move and halfedge/UV visual QA
        run: node scripts/pro-studio-pass18-cap-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload source-matched PNG, edited GLB and native project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass18-halfedge-cap-webgl
          path: |
            dist/pro-studio/pass17-acceptance/**
            dist/pro-studio/pass18-acceptance/**
          if-no-files-found: warn
          retention-days: 14
