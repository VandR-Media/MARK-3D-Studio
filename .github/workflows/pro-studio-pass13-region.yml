name: MARK Studio Pass 13 Region Extrude and actual WebGL2

on:
  push:
    branches:
      - feature/pro-studio-pass13-region-extrude
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-extrude:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and format/profile regression
        run: |
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check tests/pro-studio-pass13-region-extrude.test.mjs
          node --check scripts/pro-studio-pass13-region-webgl-accept.mjs
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build standalone offline WebGL2 editor
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run real Shift-click multi-face, extrusion and save/reopen QA
        run: node scripts/pro-studio-pass13-region-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload source-matched region QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass13-region-extrude-webgl
          path: dist/pro-studio/pass13-acceptance/**
          if-no-files-found: warn
          retention-days: 14
