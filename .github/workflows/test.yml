name: MARK 3D Studio MVP
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Three.js and esbuild
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check src/glb.js
          node --check src/materials.js
          node --check src/sample.js
          node --check src/app.js
          node --check src/topology.js
          node --check src/mesh-core.js
          node --check src/mesh-ui.js
          node --check src/head-fixture.js
          node --check scripts/capture-preview.mjs
      - name: GLB roundtrip and material tests
        run: npm test
      - name: Mesh editing and GLB persistence tests
        run: npm run test:mesh
      - name: Binary topology GLB tests
        run: npm run test:topology
      - name: Build practice head before and after editing
        run: npm run mesh:fixtures
      - name: Upload head GLB examples
        uses: actions/upload-artifact@v4
        with:
          name: mark-3d-studio-v0.2-practice-head-before-after
          path: |
            samples/organic-head-before.glb
            samples/organic-head-edited.glb
      - name: Build independent polygonal GLB samples
        run: npm run smoke:glb
      - name: Upload both GLB files
        uses: actions/upload-artifact@v4
        with:
          name: mark-3d-studio-glb-smoke
          path: samples/*.glb
      - name: Build portable HTML preview
        run: npm run build:standalone
      - name: Verify offline HTML (no CDN)
        run: npm run test:standalone
      - name: Upload portable HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: mark-3d-studio-OFFLINE-Huawei-v0.1.2
          path: dist/MARK-3D-Studio-standalone.html
