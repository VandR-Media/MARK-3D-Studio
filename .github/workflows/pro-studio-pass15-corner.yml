name: MARK Studio Pass 15 corner topology and real UV seam WebGL2

on:
  push:
    branches:
      - feature/pro-studio-pass15-corner-topology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corner-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax and module contracts
        run: |
          node --check src/pro-studio/mesh-corner-topology.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check scripts/pro-studio-seam-fixture.mjs
          node --check scripts/pro-studio-pass15-seam-webgl-accept.mjs
          node --check tests/pro-studio-pass15-corner-topology.test.mjs
      - name: Unit exact seam topology and Pass 9-14 regressions
        run: |
          node --test tests/pro-studio-pass15-corner-topology.test.mjs
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build real offline WebGL2 viewer
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Regression - real region overlay and native replay
        run: node scripts/pro-studio-pass14-overlay-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Test read-only corner seam vs unsafe RegionExtrude in WebGL2
        run: node scripts/pro-studio-pass15-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload real WebGL evidence with native source hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass15-corner-seam-webgl
          path: |
            dist/pro-studio/pass14-acceptance/**
            dist/pro-studio/pass15-acceptance/**
          if-no-files-found: warn
          retention-days: 14
