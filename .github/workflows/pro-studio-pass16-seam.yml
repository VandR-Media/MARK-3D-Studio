name: MARK Studio Pass 16 explicit seam links and source-stable logical IDs

on:
  push:
    branches:
      - feature/pro-studio-pass16-explicit-seam-links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source module syntax
        run: |
          node --check src/pro-studio/mesh-seam-identity.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check scripts/pro-studio-pass16-seam-webgl-accept.mjs
          node --check tests/pro-studio-pass16-explicit-seam-links.test.mjs
      - name: New identity/native/AI Bridge tests
        run: node --test tests/pro-studio-pass16-explicit-seam-links.test.mjs
      - name: Previous mesh, rig, corner, AI Bridge and Visual Engine v2 regression
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build true offline WebGL2 viewer
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Previous genuine seam QA
        run: node scripts/pro-studio-pass15-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Real browser approved source seams, undo/redo and native GLB proof
        run: node scripts/pro-studio-pass16-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload source-matched reports and actual WebGL2 PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass16-explicit-seam-links-webgl
          path: |
            dist/pro-studio/pass15-acceptance/**
            dist/pro-studio/pass16-acceptance/**
          if-no-files-found: warn
          retention-days: 14
