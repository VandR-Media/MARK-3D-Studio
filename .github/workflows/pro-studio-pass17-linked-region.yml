name: MARK Studio Pass 17 physical UV-seam Region Extrude

on:
  push:
    branches:
      - feature/pro-studio-pass17-seam-region-extrude
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-region-extrude:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax of kernel, native bridge, UI and tests
        run: |
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/mesh-seam-identity.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check scripts/pro-studio-pass17-skinned-seam-fixture.mjs
          node --check tests/pro-studio-pass17-seam-region-extrude.test.mjs
          node --check scripts/pro-studio-pass17-seam-webgl-accept.mjs
      - name: New real skinned binary/UV/morph/native seam extrusion tests
        run: node --test tests/pro-studio-pass17-seam-region-extrude.test.mjs
      - name: Regression of edit/rig/UV seam and Visual Engine v2
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs tests/pro-studio-pass16-explicit-seam-links.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build standalone genuine WebGL2 editor
        run: npm run pro:rig:viewer
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Regression existing explicit seam GUI
        run: node scripts/pro-studio-pass16-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Real GUI physical skinned seam extrusion, pixel and GLB/native evidence
        run: node scripts/pro-studio-pass17-seam-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload source-matched true WebGL2 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass17-seam-region-extrude-webgl
          path: |
            dist/pro-studio/pass16-acceptance/**
            dist/pro-studio/pass17-acceptance/**
          if-no-files-found: warn
          retention-days: 14
