name: MARK Studio Pass 26 independent binary editable MeshData

on:
  push:
    branches:
      - feature/pro-studio-pass26-binary-editable-meshdata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-meshdata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Validate MeshData core, native, Bridge and browser syntax
        run: |
          node --check src/pro-studio/editable-meshdata-binary.js
          node --check src/pro-studio/mesh-edit-core.js
          node --check src/pro-studio/meshdata-halfedge-preview.js
          node --check src/pro-studio/markscene-v3-preview.js
          node --check src/pro-studio/ai-bridge-core.js
          node --check src/pro-studio/rig-viewer.js
          node --check tests/pro-studio-pass26-binary-meshdata.test.mjs
          node --check scripts/pro-studio-pass26-meshdata-webgl-accept.mjs
      - name: Independently stored binary MeshData, SHA, native and island unit tests
        run: node --test tests/pro-studio-pass26-binary-meshdata.test.mjs
      - name: Regression Pass9-25, core and Visual Engine v2
        run: |
          node --test tests/pro-studio-pass9-snap.test.mjs tests/pro-studio-pass10-edge-picking.test.mjs tests/pro-studio-pass11-extrude.test.mjs tests/pro-studio-pass13-region-extrude.test.mjs tests/pro-studio-pass14-region-overlay.test.mjs tests/pro-studio-pass15-corner-topology.test.mjs tests/pro-studio-pass16-explicit-seam-links.test.mjs tests/pro-studio-pass17-seam-region-extrude.test.mjs tests/pro-studio-pass18-halfedge-cap-move.test.mjs tests/pro-studio-pass19-cap-poke-remap.test.mjs tests/pro-studio-pass20-multi-poke-remap.test.mjs tests/pro-studio-pass21-radial-edge-split.test.mjs tests/pro-studio-pass22-multi-radial-splits.test.mjs tests/pro-studio-pass23-child-edge-lineage.test.mjs tests/pro-studio-pass24-depth2-daughter-lineage.test.mjs tests/pro-studio-pass25-uv-corner-cow.test.mjs
          node --test tests/pro-studio-mesh-edit.test.mjs tests/pro-studio-primitives.test.mjs tests/pro-studio-ai-bridge.test.mjs
          npm run test:visual-v2
      - name: Build self-contained WebGL2 editor with actual UV MeshData
        run: npm run pro:rig:viewer
      - name: Install real Chromium browser
        run: npx playwright install chromium
      - name: Regression P25 true per-corner UV edits
        run: node scripts/pro-studio-pass25-uv-corner-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: P26 binary MeshData real island GUI and 3-resource native replay
        run: node scripts/pro-studio-pass26-meshdata-webgl-accept.mjs
        env:
          MARK_SOURCE_SHA: ${{ github.sha }}
      - name: Upload real glTF, editable .markscene, UV PNG and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-pass26-binary-meshdata-webgl
          path: |
            dist/pro-studio/pass25-acceptance/**
            dist/pro-studio/pass26-acceptance/**
          if-no-files-found: warn
          retention-days: 14
